<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Morning Briefing</title>
<style>
  :root {
    --bg: #f4f1ec; --card: #ffffff; --ink: #1d1b19; --muted: #6f6a63;
    --line: #e4dfd7; --up: #138a4a; --down: #c8352c; --link: #2457c5;
    --sun: linear-gradient(135deg, #ff9a3c, #ff4f7b 55%, #7a5cff);
    --cyber: #2f6fe4; --gain: #138a4a; --drop: #c8352c; --watch: #8a4fd8; --tip: #e07a10;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121214; --card: #1c1c20; --ink: #f1efeb; --muted: #9a958e;
      --line: #2c2c31; --up: #3ccf7f; --down: #ff6b5f; --link: #7aa6ff;
      --cyber: #6b9dff; --gain: #3ccf7f; --drop: #ff6b5f; --watch: #b78aff; --tip: #ffad4d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 640px; margin: 0 auto; padding: 20px 16px 48px; }
  header h1 { margin: 0 0 4px; font-size: 26px; }
  header p { margin: 0 0 20px; color: var(--muted); }
  .day {
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    padding: 18px; margin-bottom: 16px;
  }
  .day.today { border: 0; box-shadow: 0 8px 28px rgb(0 0 0 / .12); position: relative; }
  .day.today::before {
    content: ""; position: absolute; inset: 0 0 auto; height: 6px;
    border-radius: 18px 18px 0 0; background: var(--sun);
  }
  .day.old { opacity: .5; filter: grayscale(.85); transition: opacity .2s, filter .2s; }
  .day.old:hover, .day.old.open { opacity: .9; filter: none; }
  .date { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; font-size: 18px; }
  .badge {
    font-size: 12px; font-weight: 700; color: #fff; background: var(--sun);
    padding: 2px 10px; border-radius: 999px;
  }
  .old .date { cursor: pointer; font-size: 16px; margin: 0; }
  .old .body { display: none; margin-top: 12px; }
  .old.open .body { display: block; }
  h3 { margin: 14px 0 6px; font-size: 13px; letter-spacing: .04em; }
  h3.cyber { color: var(--cyber); } h3.gain { color: var(--gain); } h3.drop { color: var(--drop); }
  h3.watch { color: var(--watch); } h3.tip { color: var(--tip); }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 6px 0; border-top: 1px solid var(--line); overflow-wrap: anywhere; }
  li:first-child { border-top: 0; }
  a { color: var(--link); text-decoration: none; }
  .chg { font-weight: 700; }
  .up { color: var(--up); } .down { color: var(--down); }
  .empty, .note { color: var(--muted); }
</style>
</head>
<body>
<main>
  <header>
    <h1>☀️ Morning Briefing</h1>
    <p>Today's briefing is at the top. Tap an older day to open it.</p>
  </header>
  <div id="days"><p class="note">Loading…</p></div>
</main>
<script>
const KIND = ["cyber", "gain", "drop", "watch", "tip"];

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function niceDate(iso) {
  return new Date(iso + "T12:00:00").toLocaleDateString(undefined,
    { weekday: "long", month: "short", day: "numeric" });
}

function renderDay(day, isToday) {
  const card = el("section", "day " + (isToday ? "today" : "old"));
  const h = el("h2", "date", niceDate(day.date));
  if (isToday) h.append(el("span", "badge", "NEW"));
  card.append(h);
  const body = el("div", "body");
  day.sections.forEach((sec, i) => {
    body.append(el("h3", KIND[i] || "", sec.heading));
    const ul = el("ul");
    if (!sec.items.length) ul.append(el("li", "empty", "Couldn't load that day"));
    for (const it of sec.items) {
      const li = el("li");
      if (it.link) {
        const a = el("a", null, it.text);
        a.href = it.link; a.target = "_blank"; a.rel = "noopener";
        li.append(a);
      } else if (typeof it.change === "number") {
        const dir = it.change > 0 ? "up" : it.change < 0 ? "down" : "";
        li.append(el("span", "chg " + dir, (it.change > 0 ? "▲ " : it.change < 0 ? "▼ " : "• ")));
        li.append(document.createTextNode(it.text));
      } else {
        li.textContent = it.text;
      }
      ul.append(li);
    }
    body.append(ul);
  });
  card.append(body);
  if (!isToday) h.addEventListener("click", () => card.classList.toggle("open"));
  return card;
}

fetch("history.json?" + Date.now())
  .then(r => r.json())
  .then(days => {
    const box = document.getElementById("days");
    box.textContent = "";
    if (!days.length) { box.append(el("p", "note", "No briefings yet.")); return; }
    days.forEach((d, i) => box.append(renderDay(d, i === 0)));
  })
  .catch(() => {
    document.getElementById("days").replaceChildren(el("p", "note", "Couldn't load briefings."));
  });
</script>
</body>
</html>
